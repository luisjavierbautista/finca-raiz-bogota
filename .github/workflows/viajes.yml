name: Completar tiempos de viaje y fachadas

# Corre 35 minutos después del barrido diario (07:00 Bogotá) para que los data.json
# ya tengan los edificios nuevos. La llave vive en Secrets del repo, nunca en el
# código: ni el agente programado ni las páginas la ven.
#
# Atiende las dos búsquedas de busquedas/: la del norte (arriendo de Luis) y la del
# occidente (arriendo y venta cerca de El Tiempo y Kennedy).
on:
  schedule:
    - cron: "35 12 * * *"      # 07:35 en Bogotá
  workflow_dispatch:            # también se puede lanzar a mano

permissions:
  contents: write

concurrency:
  group: actualizar-sitio       # nunca dos escrituras a la vez
  cancel-in-progress: false

jobs:
  viajes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Completar tiempos y fachadas de las dos búsquedas
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::No hay llave en Secrets; los edificios nuevos quedan sin tiempos ni fachadas."
            exit 0
          fi
          for b in norte occidente; do
            echo "::group::$b"
            # El tope por corrida evita que un barrido con muchos edificios nuevos
            # se lleve la cuota de golpe; lo que falte se completa al día siguiente.
            python3 tools/viajes.py --busqueda "$b" --limite 80
            python3 tools/streetview.py --busqueda "$b"
            echo "::endgroup::"
          done

      - name: Regenerar las páginas
        env:
          SV_EMBED_KEY: ${{ vars.SV_EMBED_KEY }}
          CARTO_KEY: ${{ vars.CARTO_KEY }}
        run: |
          for b in norte occidente; do
            python3 tools/render.py --busqueda "$b"
          done
          python3 tools/portada.py

      - name: Verificar que no se filtren credenciales
        env:
          SV_EMBED_KEY: ${{ vars.SV_EMBED_KEY }}
        run: |
          # Busca por la forma de una llave (AIza + 35 caracteres), no por su prefijo
          # literal, para que el propio workflow no se detecte a si mismo. La llave de
          # Maps Embed es publica por diseno y esta restringida por dominio, asi que
          # es la unica permitida: cualquier otra que aparezca detiene la publicacion.
          python3 - <<'PY'
          import os, re, subprocess, sys
          permitida = os.environ.get("SV_EMBED_KEY", "").strip()
          patron = re.compile(r"AIza[0-9A-Za-z_-]{35}")
          archivos = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          malos = {}
          for f in archivos:
              try:
                  t = open(f, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              for k in set(patron.findall(t)):
                  if k != permitida:
                      malos.setdefault(f, set()).add(k[:10] + "...")
          if malos:
              for f, ks in malos.items():
                  print("::error file=%s::llave no autorizada %s" % (f, ", ".join(sorted(ks))))
              sys.exit(1)
          print("sin llaves indebidas" + (" (la de Maps Embed es publica y esta permitida)" if permitida else ""))
          PY

      - name: Publicar si hubo cambios
        run: |
          if git diff --quiet; then
            echo "nada que publicar"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          N=$(python3 - <<'PY'
          import io, json, os
          t = 0
          for p in ("norte/viajes.json", "occidente/viajes.json"):
              if os.path.exists(p):
                  t += len(json.load(io.open(p, encoding="utf-8"))["edificios"])
          print(t)
          PY
          )
          git add -A index.html norte occidente favoritos-estado.json
          git commit -m "Tiempos de viaje al día: $N edificios en caché [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
